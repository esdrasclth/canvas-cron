services:
  unitec-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    shm_size: 1gb
    environment:
      DATA_DIR: /app/data
      PORT: 3000
      HEADLESS: ${HEADLESS:-true}
      TIMEZONE: ${TIMEZONE:-America/Tegucigalpa}
      DAILY_DIGEST_HOUR: ${DAILY_DIGEST_HOUR:-18}
      REMINDER_HOURS: ${REMINDER_HOURS:-72,24,6,3,1}
      QUIET_HOURS: ${QUIET_HOURS:-23-6}
      WEEKLY_DIGEST_DAY: ${WEEKLY_DIGEST_DAY:-0}
      WEEKLY_DIGEST_HOUR: ${WEEKLY_DIGEST_HOUR:-19}
      HEARTBEAT_MINUTES: ${HEARTBEAT_MINUTES:-90}
      SESSION_WARN_DAYS: ${SESSION_WARN_DAYS:-5}
      TRACK_GRADES: ${TRACK_GRADES:-true}
      TRACK_ANNOUNCEMENTS: ${TRACK_ANNOUNCEMENTS:-true}
      ANNOUNCEMENT_LOOKBACK_DAYS: ${ANNOUNCEMENT_LOOKBACK_DAYS:-14}
      AUTO_REFRESH_SESSION: ${AUTO_REFRESH_SESSION:-true}
      SEND_INITIAL_NEW_TASKS: ${SEND_INITIAL_NEW_TASKS:-false}
      SEND_STARTUP_DIGEST: ${SEND_STARTUP_DIGEST:-true}
      TELEGRAM_DRY_RUN: ${TELEGRAM_DRY_RUN:-true}
      TELEGRAM_COMMANDS: ${TELEGRAM_COMMANDS:-true}
      TELEGRAM_POLL_TIMEOUT: ${TELEGRAM_POLL_TIMEOUT:-50}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      UNITEC_EMAIL: ${UNITEC_EMAIL:-}
      UNITEC_PASSWORD: ${UNITEC_PASSWORD:-}
      AUTH_STATE_B64: ${AUTH_STATE_B64:-}
    volumes:
      - unitec-bot-data:/app/data
    healthcheck:
      # /alive responde 200 aunque falte la sesion: el contenedor debe seguir en
      # pie para que las tareas programadas de Dokploy puedan ejecutarse.
      test: ["CMD-SHELL", "node -e \"require('node:http').get('http://127.0.0.1:3000/alive',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  unitec-bot-data:

